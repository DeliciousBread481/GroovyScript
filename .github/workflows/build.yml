name: Build  
  
on:  
  push:  
    branches: [ test ]  
  pull_request:  
  workflow_dispatch:  
  
permissions:  
  contents: read  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
        with:  
          fetch-depth: 0
  
      - name: Set up JDK 17  
        uses: actions/setup-java@v4  
        with:  
          distribution: 'temurin'  
          java-version: '17'  
  
      - name: Setup Gradle  
        uses: gradle/actions/setup-gradle@v4  
        with:  
          cache-read-only: true  
  
      - name: Grant execute permission for gradlew  
        run: chmod +x ./gradlew  
  
      - name: Build  
        uses: nick-fields/retry@v3  
        with:  
          max_attempts: 3  
          retry_wait_seconds: 60  
          timeout_minutes: 60  
          on_retry_command: rm -rf ~/.gradle/caches/modules-2/files-2.1/curse.maven ~/.gradle/caches/modules-2/metadata-*/descriptors/curse.maven  
          command: ./gradlew build --stacktrace --refresh-dependencies  
  
      - name: Upload build artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: groovyscript-jars  
          path: build/libs/*.jar  
          if-no-files-found: error